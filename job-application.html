<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata & Page Setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edmundo Murima - Job Application</title>
    <meta name="description" content="Job application form featuring personal details, technical skills, shift choices, and cover letter for Edmundo Murima.">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>

    <header>
        <h1>Job Application Form</h1>
        <p><em>Apply for Full-Stack Developer & Engineering Roles</em></p>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="registration.html">Student Registration</a> | 
            <a href="job-application.html">Job Application</a>
        </nav>
    </header>

    <hr>

    
    <main>
        <form action="#" method="POST">
            
            
            <div>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" value="Edmundo Felizardo Lopes Murima Junior" required>
            </div>
            <br>

            <div>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" value="edmundo@example.com" required>
            </div>
            <br>

            <div>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="+351 912345678" required>
            </div>
            <br>

            
            <div>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required>
            </div>
            <br>

            
            <div>
                <label for="portfolio">Portfolio URL:</label><br>
                <input type="url" id="portfolio" name="portfolio" placeholder="https://github.com/your-username" required>
            </div>
            <br>

            
            <div>
                <label>Preferred Shift:</label><br>
                <input type="radio" id="shift-full" name="shift" value="full-time" checked>
                <label for="shift-full">Full-Time</label><br>
                
                <input type="radio" id="shift-part" name="shift" value="part-time">
                <label for="shift-part">Part-Time</label><br>
                
                <input type="radio" id="shift-remote" name="shift" value="remote">
                <label for="shift-remote">Remote</label>
            </div>
            <br>

            
            <div>
                <label>Technical Skills:</label><br>
                <input type="checkbox" id="skill-html" name="skills" value="html" checked>
                <label for="skill-html">HTML5 & Semantic Markup</label><br>

                <input type="checkbox" id="skill-git" name="skills" value="git" checked>
                <label for="skill-git">Git & GitHub Version Control</label><br>

                <input type="checkbox" id="skill-engineering" name="skills" value="engineering">
                <label for="skill-engineering">Civil Engineering Software</label>
            </div>
            <br>

            
            <div>
                <label for="jobrole">Applying for Job Role:</label><br>
                <select id="jobrole" name="jobrole" required>
                    <option value="">-- Select a Role --</option>
                    <option value="frontend">Junior Front-End Developer</option>
                    <option value="civil-eng">Civil Engineering Consultant</option>
                    <option value="fullstack">Full-Stack Web Developer</option>
                </select>
            </div>
            <br>

            
            <div>
                <label for="coverletter">Cover Letter:</label><br>
                <textarea id="coverletter" name="coverletter" rows="5" cols="40" placeholder="Write a brief summary about your background and motivation..." required></textarea>
            </div>
            <br>

            
            <div>
                <label for="applicationid">Application Status (System Generated):</label><br>
                <input type="text" id="applicationid" name="applicationid" value="STATUS-PENDING-001" disabled>
            </div>
            <br>

        
            <div>
                <button type="submit">Submit Application</button>
            </div>

        </form>
    </main>

    <hr>

    
    <footer>
        <p>&copy; 2026 Edmundo Murima. All rights reserved.</p>
    </footer>

</body>
</html>

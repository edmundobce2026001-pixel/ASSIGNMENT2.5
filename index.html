<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edmundo Murima - Profile Card Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="profile-container">
        
        <div class="profile-card">
            
            <span class="status-badge">Available</span>

            
            <img src="images/profile.jpg" alt="Edmundo Murima Profile Photo" class="profile-img">

            
            <h2>Edmundo Murima</h2>
            <p class="role">Web Developer & Civil Engineer</p>

            
            <p class="description">
                Passionate about building responsive web applications and designing robust structural engineering solutions.
            </p>

            
            <div class="skills-container">
                <span class="skill-tag">HTML5 & CSS3</span>
                <span class="skill-tag">Git Workflow</span>
                <span class="skill-tag">Structural Design</span>
            </div>

            
            <button class="contact-btn">Get in Touch</button>
        </div>
    </main>
</body>
</html>

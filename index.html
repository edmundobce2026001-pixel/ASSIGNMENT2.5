<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edmundo Murima - Home Portfolio</title>
    <meta name="description" content="Official personal portfolio of Edmundo Murima, featuring web development projects, civil engineering background, and academic forms.">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>

    <hr>
    <main>
        <form action="#" method="POST">
            
            
            <div>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Edmundo Murima" required>
            </div>
            <br>

        
            <div>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="edmundo@example.com" required>
            </div>
            <br>

            
            <div>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required>
            </div>
            <br>

            
            <div>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="+351 912345678" required>
            </div>
            <br>
            
            <div>
                <label for="age">Age:</label><br>
                <input type="number" id="age" name="age" min="16" max="100" required>
            </div>
            <br>

            
            <div>
                <button type="submit">Register Student</button>
            </div>

        </form>
    </main>
    <hr>
    <footer>
        <p>&copy; 2026 Edmundo Murima. All rights reserved.</p>
    </footer>

</body>
</html>
